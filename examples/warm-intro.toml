# Example revgate.toml for a warm intro / referral motion.
#
# Warm intros are lower risk than cold outbound because the prospect has
# opted in via a mutual contact. The compliance gates are relaxed (no
# restricted-state blocking) but data quality gates remain.
#
# Usage:
#   revgate lint -c examples/warm-intro.toml leads.csv

[lint]
strict = false

# No restricted states for warm intros — the prospect has opted in.
restricted_states = []

# DNC staleness is less critical for warm intros, but still checked.
dnc_stale_days = 90

# Enrichment can be older — warm-intro leads are often referrals from
# existing customers, so their data is already known.
stale_enrichment_days = 180

# Title exclusions are relaxed — you may want to reach individual
# contributors for warm intros.
title_exclude_keywords = ["intern", "student"]

# Higher headcount ceiling — warm intros can target enterprise.
headcount_exclude_above = 50000

# Warm-intro leads may have been contacted more recently.
recent_contact_days = 7

# Suppression sources — replace these paths with your real data files.
# The defaults below point at the bundled fixtures so the config runs out
# of the box. REMOVE THESE and point at your own exports before production.
[lint.sources]
suppression = "../fixtures/crm-export.csv"
dnc = "../fixtures/dnc.csv"
dnc_exported = "2026-08-01"
