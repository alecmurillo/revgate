# Example revgate.toml for an ABM / enterprise motion.
#
# Account-based marketing targets a small number of high-value accounts.
# The gates are tuned for precision: strict title filtering, tight
# headcount range, and aggressive enrichment staleness.
#
# Usage:
#   revgate lint -c examples/abm-enterprise.toml leads.csv

[lint]
# ABM is strict — P1 findings also block.
strict = true

# ABM is US-based for this example, no state restrictions.
restricted_states = []

# DNC must be very fresh for enterprise deals.
dnc_stale_days = 14

# Enrichment must be very fresh — enterprise data changes quickly.
stale_enrichment_days = 30

# Strict title filtering — only decision-makers and influencers.
title_exclude_keywords = [
    "intern", "student", "assistant", "coordinator",
    "junior", "trainee", "contractor",
]

# Tight headcount range — enterprise only.
headcount_exclude_above = 100000

# Enterprise deals have longer cycles; recent contact window is wider.
recent_contact_days = 30
